name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull
            php8.4 /usr/bin/composer2 install --no-dev --optimize-autoloader
            php8.4 ./bin/console doctrine:schema:update --force
            php8.4 ./bin/console tailwind:build --minify
            php8.4 ./bin/console asset-map:compile
            php8.4 ./bin/console cache:clear